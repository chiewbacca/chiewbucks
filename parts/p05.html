async function fetchB64(file) {
  const urls = [];
  const host = location.hostname || "";
  if (location.protocol.startsWith("http") && host !== "htmlpreview.github.io") urls.push("img-b64/" + file);
  urls.push(RAW_BASE + file);
  for (const url of urls) {
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const text = (await res.text()).trim();
      if (text && !text.startsWith("<")) return text;
    } catch (err) { /* try next */ }
  }
  return "";
}
async function loadImgs() {
  await Promise.all(Object.entries(DRINK_FILES).map(async ([key, file]) => {
    const text = await fetchB64(file);
    if (text) CHIEW_IMGS[key] = "data:image/webp;base64," + text;
  }));
  const logo = document.getElementById("brandLogo");
  if (logo && CHIEW_IMGS.logo) logo.src = CHIEW_IMGS.logo;
  const hero = document.getElementById("heroDrink");
  if (hero && CHIEW_IMGS["caramel-cloud"]) hero.src = CHIEW_IMGS["caramel-cloud"];
  renderMenu();
  renderCart();
  const status = document.getElementById("brewStatus");
  if (status) status.classList.remove("show");
}

const beansEl = document.getElementById("beans");
for (let i = 0; i < 22; i++) {
  const b = document.createElement("div");
  b.className = "bean" + (i % 5 === 0 ? " gold" : "");

const finePointer = window.matchMedia("(pointer: fine)").matches;
if (finePointer) {
  window.addEventListener("pointermove", (e) => {
    const x = e.clientX / window.innerWidth - 0.5;
    const y = e.clientY / window.innerHeight - 0.5;
    document.documentElement.style.setProperty("--px", (x * 28) + "px");
    document.documentElement.style.setProperty("--py", (y * 18) + "px");
  }, { passive: true });
  const hv = document.getElementById("heroVisual");
  hv.addEventListener("pointermove", (e) => {
    const r = hv.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    hv.style.transform = "rotateY(" + (x * 14) + "deg) rotateX(" + (-y * 10) + "deg)";
  });
  hv.addEventListener("pointerleave", () => { hv.style.transform = ""; });
}

let heroI = 0;
setInterval(() => {
  heroI = (heroI + 1) % DRINKS.length;
  const drink = DRINKS[heroI];
  const src = imgOf(drink.id);
  const img = document.getElementById("heroDrink");
  const name = document.getElementById("heroName");
  if (name) name.textContent = drink.name;
  if (!src || !img) return;
  img.style.opacity = "0";
  setTimeout(() => { img.src = src; img.alt = drink.name; img.style.opacity = "1"; }, 280);
}, 6800);

const grid = document.getElementById("menuGrid");
let activeFilter = "all";
const cardObserver = new IntersectionObserver((entries) => {
  entries.forEach((en) => {
    if (!en.isIntersecting) return;
    en.target.classList.add("in");
    cardObserver.unobserve(en.target);
  });
}, { threshold: 0.16, rootMargin: "0px 0px -8% 0px" });

function renderMenu() {
  const list = DRINKS.filter((d) => activeFilter === "all" || d.cat === activeFilter);
  grid.innerHTML = list.map((d, i) => `
    <button class="card" type="button" data-id="${d.id}" style="transition-delay:${Math.min(i, 8) * 55}ms">
      <div class="card-lift">
        <div class="card-img">
          <span class="card-tag">${d.tag}</span>
          <img src="${imgOf(d.id)}" alt="${d.name}" />
        </div>
        <div class="card-body">
          <h3>${d.name}</h3>
          <p class="desc">${d.desc}</p>
          <div class="card-row">
            <span class="price">$${d.price.toFixed(2)}</span>
            <span class="add-mini" data-quick="${d.id}" role="button" aria-label="Quick add ${d.name}">+</span>
          </div>
        </div>
      </div>
    </button>`).join("");
  grid.querySelectorAll(".card").forEach((card) => cardObserver.observe(card));
}

document.querySelectorAll(".filter").forEach((btn) => {

    document.querySelectorAll(".filter").forEach((b) => b.classList.remove("active"));

    activeFilter = btn.dataset.filter;
    renderMenu();
  });
});
