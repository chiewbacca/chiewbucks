<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#006241" />
<title>ChiewBucks — Sip the Extraordinary</title>
<meta name="description" content="ChiewBucks — a playful coffeehouse mock store for Emily & Oliver. Order drinks, catch beans. Demo only." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --green: #006241;
  --green-deep: #01281c;
  --green-mid: #0b7a4b;
  --green-bright: #1cbf78;
  --cream: #f4efe4;
  --cream-2: #fffaf3;
  --ink: #13241c;
  --muted: #5c6b63;
  --gold: #d4b06a;
  --gold-2: #f3deaa;
  --white: #ffffff;
  --shadow: 0 22px 60px rgba(1, 40, 28, 0.18);
  --radius: 26px;
  --nav-h: 72px;
  --px: 0px;
  --py: 0px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "Outfit", system-ui, sans-serif;
  color: var(--ink);
  line-height: 1.45;
  overflow-x: hidden;
  background:
    radial-gradient(900px 520px at -10% -10%, #ffffff 0%, transparent 55%),
    radial-gradient(800px 480px at 110% 0%, #d9f5e6 0%, transparent 50%),
    radial-gradient(700px 500px at 80% 110%, #f7e7c3 0%, transparent 46%),
    var(--cream);
  -webkit-tap-highlight-color: transparent;
}
img { max-width: 100%; display: block; }
button, a { font-family: inherit; }
button { -webkit-user-select: none; user-select: none; }

.mesh, .beans { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.mesh { z-index: 0; }
.beans { z-index: 1; }
.blob {
  position: absolute; border-radius: 50%; filter: blur(40px);
  opacity: 0.55; mix-blend-mode: multiply;
  animation: blobDrift 16s ease-in-out infinite;
  transform: translate(var(--px), var(--py));
}
.b1 { width: 340px; height: 340px; background: #b7ebcf; top: 8%; left: -80px; }
.b2 { width: 420px; height: 420px; background: #f3e0b0; top: 32%; right: -140px; animation-delay: -6s; }
.b3 { width: 280px; height: 280px; background: #c9f0dc; bottom: 8%; left: 20%; animation-delay: -11s; }
@keyframes blobDrift {
  0%, 100% { translate: 0 0; }
  50% { translate: 24px -30px; }
}
.bean {
  position: absolute; width: 16px; height: 22px;
  border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  background: linear-gradient(140deg, #6a3d24, #2c160e 70%);
  opacity: 0.16;
  animation: floatBean linear infinite;
  box-shadow: inset -3px -2px 0 rgba(255,220,180,0.25);
}
.bean.gold {
  background: linear-gradient(140deg, #f3deaa, #c4a15a);
  opacity: 0.28;
}
.bean::after {
  content: ""; position: absolute; left: 46%; top: 12%; bottom: 12%; width: 1.5px;
  background: rgba(255,230,190,0.45); border-radius: 2px; transform: rotate(8deg);
}
@keyframes floatBean {
  0% { transform: translateY(105vh) rotate(0deg); }
  100% { transform: translateY(-18vh) rotate(340deg); }
}

.nav {
  position: sticky; top: 0; z-index: 40;
  height: var(--nav-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  background: rgba(244, 239, 228, 0.78);
  backdrop-filter: blur(16px) saturate(1.3);
  border-bottom: 1px solid rgba(0, 98, 65, 0.08);
}
.brand {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--green);
  font-weight: 800; letter-spacing: -0.03em; font-size: 1.18rem;
}
.logo-wrap {
  width: 48px; height: 48px; border-radius: 50%;
  display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #fff, #e7f6ee 40%, #cfe8da);
  box-shadow: 0 8px 18px rgba(0,98,65,0.25), inset 0 0 0 2px rgba(212,176,106,0.7);
  animation: logoWiggle 5.5s ease-in-out infinite;
}
.logo-wrap img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
@keyframes logoWiggle {
  0%, 78%, 100% { transform: rotate(0) scale(1); }
  84% { transform: rotate(-10deg) scale(1.06); }
  90% { transform: rotate(12deg) scale(1.08); }
  95% { transform: rotate(-4deg) scale(1.02); }
}
.nav-actions { display: flex; align-items: center; gap: 6px; }
.nav-link {
  display: none; color: var(--green); text-decoration: none; font-weight: 700; font-size: 0.92rem;
  padding: 8px 12px; border-radius: 999px;
}
.nav-link:hover { background: rgba(0,98,65,0.08); }
@media (min-width: 760px) { .nav-link { display: inline-block; } }
.cart-btn {
  position: relative; border: none; background: linear-gradient(180deg, #0b8a56, var(--green));
  color: white; width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
  display: grid; place-items: center;
  box-shadow: 0 10px 24px rgba(0,98,65,0.35), inset 0 1px 0 rgba(255,255,255,0.35);
  transition: transform 0.2s ease;
}
.cart-btn:hover { transform: translateY(-2px) scale(1.04); }
.cart-btn:active { transform: scale(0.94); }
.cart-btn svg { width: 22px; height: 22px; fill: currentColor; }
.cart-count {
  position: absolute; top: -4px; right: -4px;
  min-width: 20px; height: 20px; padding: 0 5px;
  background: linear-gradient(180deg, var(--gold-2), var(--gold));
  color: var(--green-deep); font-size: 0.72rem; font-weight: 800;
  border-radius: 999px; display: grid; place-items: center;
  transform: scale(0); transition: transform 0.28s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 4px 10px rgba(180,140,50,0.4);
}
.cart-count.show { transform: scale(1); }

main { position: relative; z-index: 2; }
.hero {
  padding: 18px 18px 28px;
  display: grid; gap: 22px;
}
@media (min-width: 920px) {
  .hero {
    grid-template-columns: 1.05fr 0.95fr;
    align-items: center; gap: 36px;
    max-width: 1120px; margin: 0 auto;
    padding: 36px 28px 48px;
  }
}
.rise { animation: rise 0.9s cubic-bezier(.16,1,.3,1) both; }
.d1 { animation-delay: .05s; } .d2 { animation-delay: .16s; }
.d3 { animation-delay: .28s; } .d4 { animation-delay: .4s; }
@keyframes rise {
  from { opacity: 0; transform: translateY(22px); }
  to { opacity: 1; transform: none; }
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.8); color: var(--green);
  font-weight: 800; font-size: 0.78rem;
  padding: 7px 12px 7px 8px; border-radius: 999px;
  box-shadow: 0 8px 24px rgba(0,40,25,0.06);
  border: 1px solid rgba(212,176,106,0.45);
}
.pulse-dot {
  width: 10px; height: 10px; border-radius: 50%; background: var(--green-bright);
  box-shadow: 0 0 0 0 rgba(28,191,120,0.7);
  animation: ping 1.8s ease-out infinite;
}
@keyframes ping {
  0% { box-shadow: 0 0 0 0 rgba(28,191,120,0.55); }
  100% { box-shadow: 0 0 0 12px rgba(28,191,120,0); }
}
.hero h1 {
  font-family: "Fraunces", Georgia, serif;
  font-weight: 560;
  font-size: clamp(2.6rem, 8vw, 4.6rem);
  line-height: 0.98; letter-spacing: -0.035em;
  color: var(--green-deep); margin: 12px 0 14px;
}
.hero h1 span {
  display
